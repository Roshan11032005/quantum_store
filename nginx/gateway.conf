# ============================================================
#  Nginx gateway — serves frontend SPA + reverse-proxies API
#  Both on the same origin (port 80) → no CORS needed.
# ============================================================

upstream backend {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # ── Security headers ─────────────────────────────────────
    add_header X-Frame-Options           "DENY"                        always;
    add_header X-Content-Type-Options    "nosniff"                     always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    # CSP: same-origin for everything; wasm-unsafe-eval for WebAssembly crypto
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; worker-src 'self' blob:; img-src 'self' data:; font-src 'self';"
        always;

    # ── API reverse proxy ────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Support large file uploads (matches MAX_UPLOAD_BYTES default 500 MiB)
        client_max_body_size 512m;
        proxy_request_buffering off;

        # Streaming downloads / chunked responses
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── Static frontend assets ───────────────────────────────
    root  /usr/share/nginx/html;
    index index.html;

    # Long-lived cache for hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — never cache so deployments propagate instantly
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback — all unknown paths → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Compression ──────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/wasm;
    gzip_min_length 1024;
}
