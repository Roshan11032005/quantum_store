# ============================================================
#  QuantumStore — full-stack compose
#  Single command: docker compose up --build
#
#  Everything runs behind a single Nginx gateway on port 80.
#  Frontend and API share the same origin → zero CORS issues.
#
#  URL layout (all on http://localhost):
#    /            → React SPA (built frontend)
#    /api/v1/*    → FastAPI backend (internal only)
#    /health      → proxied to backend /api/v1/health
# ============================================================

services:

  # ── Nginx gateway (single public port) ────────────────────
  gateway:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # API calls go to the same origin → relative path, no CORS
        VITE_API_URL: /api/v1
    ports:
      - "${GATEWAY_PORT:-80}:80"
    environment:
      - BACKEND_HOST=api
      - BACKEND_PORT=8000
    # Inject the upstream address at run-time so we can reuse
    # the image without rebuilding when backend hostname changes.
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped

  # ── FastAPI backend ────────────────────────────────────────
  api:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Same-origin: no browser reaches the backend directly,
      # so CORS only needs to allow the gateway (internal).
      # Setting it to the public-facing origin is fine and
      # keeps backend CORS middleware harmless.
      CORS_ORIGINS: "http://localhost:${GATEWAY_PORT:-80},http://gateway"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pqc_storage}
      MINIO_ENDPOINT: "minio:9000"
      STORAGE_BACKEND: "${STORAGE_BACKEND:-minio}"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    # Backend is NOT exposed to the host — only reachable via gateway
    expose:
      - "8000"

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-pqc_storage}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── MinIO (object store) ───────────────────────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    volumes:
      - miniodata:/data
    # MinIO console is still reachable on 9001 for debugging
    ports:
      - "9001:9001"
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  backend_data:
