# ============================================================
#  QuantumStore — full-stack compose
#  Single command: docker compose up --build
#
#  Everything runs behind a single Nginx gateway on port 80.
#  Frontend and API share the same origin → zero CORS issues.
#
#  URL layout (all on http://localhost):
#    /            → React SPA (built frontend)
#    /api/v1/*    → FastAPI backend (internal only)
# ============================================================

services:

  # ── Nginx gateway (single public port) ────────────────────
  gateway:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        # API calls go to the same origin → relative path, no CORS
        VITE_API_URL: /api/v1
    ports:
      - "${GATEWAY_PORT:-80}:80"
    volumes:
      - ./nginx/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── FastAPI backend ────────────────────────────────────────
  api:
    build:
      context: backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      CORS_ORIGINS: "http://localhost:${GATEWAY_PORT:-80},http://gateway"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-pqc_storage}
      # Use local filesystem storage — no MinIO/S3 dependency needed.
      STORAGE_BACKEND: "local"
      STORAGE_ROOT: "/app/data"
    volumes:
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-pqc_storage}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  backend_data:
