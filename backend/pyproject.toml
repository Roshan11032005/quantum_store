[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-outsourced-storage-backend"
version = "0.1.0"
description = "Secure outsourced storage backend with post-quantum cryptographic support"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PQC Storage Team" }]
dependencies = [
  "fastapi>=0.115.0,<1",
  "uvicorn[standard]>=0.30.0,<1",
  "sqlalchemy[asyncio]>=2.0.32,<3",
  "aiosqlite>=0.20.0,<1",
  "asyncpg>=0.30.0,<1",
  "alembic>=1.13.2,<2",
  "pydantic>=2.8.2,<3",
  "pydantic-settings>=2.3.4,<3",
  "python-multipart>=0.0.9,<1",
  "pyjwt>=2.9.0,<3",
  "cryptography>=43.0.0,<44",
  "slowapi>=0.1.9,<1",
  "boto3>=1.35.0,<2",
  "httpx>=0.27.0,<1",
  "liboqs-python>=0.10.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2,<9",
  "pytest-asyncio>=0.24.0,<1",
  "pytest-cov>=5.0.0,<6",
  "ruff>=0.6.8,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
